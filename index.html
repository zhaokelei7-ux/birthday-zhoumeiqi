<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>周美琪，生日快乐~</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <h1>周美琪，生日快乐~</h1>
    <div class="progress" aria-live="polite">
      <strong id="progress-count">0</strong> / 28 颗星星已点亮
    </div>
    <button id="finale-replay" class="ghost-btn" type="button" hidden>再看一次流星</button>
    <button id="reset-btn" class="ghost-btn" type="button">重新开始</button>
  </header>

  <main>
    <p id="hint" class="hint">点击任意一颗星星，听 TA 对你说生日快乐~</p>

    <div class="sky-wrap">
      <svg id="sky" class="sky" viewBox="0 0 1000 1000" role="group" aria-label="生日星空，共 28 颗星星"></svg>
    </div>

    <ul class="legend" aria-label="星空分组图例">
      <li><span class="dot sprint"></span>冲刺队</li>
      <li><span class="dot war"></span>战神队</li>
      <li><span class="dot beyond"></span>超越队</li>
      <li><span class="dot power"></span>力量队</li>
      <li><span class="dot volunteer"></span>志工团</li>
      <li><span class="dot teacher"></span>班主任</li>
    </ul>
  </main>

  <div id="card" class="card" role="dialog" aria-modal="true" aria-labelledby="card-title" hidden>
    <div class="card-panel">
      <button id="card-close" class="card-close" type="button" aria-label="关闭">×</button>
      <p id="card-kicker" class="card-kicker"></p>
      <h2 id="card-title" class="card-title"></h2>
      <p id="card-blessing" class="card-blessing" aria-live="polite"></p>
      <div class="card-player">
        <div class="card-bar-track"><div id="card-bar" class="card-bar-fill"></div></div>
        <p id="card-status" class="card-status" aria-live="polite"></p>
      </div>
      <button id="card-replay" class="card-replay" type="button" hidden>重播语音</button>
    </div>
  </div>

  <div id="finale" class="finale" role="dialog" aria-modal="true" aria-label="生日祝福结局" hidden>
    <canvas id="finale-canvas"></canvas>
    <div class="finale-content">
      <p class="finale-kicker">28 颗星星，全部点亮</p>
      <h2>周美琪，生日快乐~！</h2>
      <p class="finale-sub">愿你许下的每个愿望，都被星光温柔接住。</p>
      <div class="finale-actions">
        <button id="finale-again" type="button">再看一次流星</button>
        <button id="finale-close" type="button">回到星空</button>
      </div>
    </div>
  </div>

  <noscript>请开启 JavaScript 后再打开这份生日祝福。</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
